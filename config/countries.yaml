# East Africa Demographic Choropleth Map - Country Configuration
# Phase 1: Kenya (KEN), Tanzania (TZA), Uganda (UGA), Rwanda (RWA), Burundi (BDI)
# Extensible for Phase 2: South Sudan (SSD), DR Congo (COD), Somalia (SOM), Ethiopia (ETH)

region:
  name: "All East Africa"
  code: "EAF"
  center: { lat: -0.5, lng: 34.5 }
  zoom: 5
  bounds:
    south: -11.75
    west: 28.8
    north: 5.5
    east: 41.9
  harmonized_level: 1
  reference_notes: "When All East Africa is selected, indicators are shown from harmonized regional surveys (DHS Program 2016-2022 and national censuses 2019-2024). Reference years vary by country."

countries:
  KEN:
    iso3: "KEN"
    name: "Kenya"
    official_name: "Republic of Kenya"
    center: { lat: 0.5, lng: 37.5 }
    zoom: 6
    bounds: { south: -4.7, west: 33.9, north: 4.65, east: 41.9 }
    census:
      agency: "Kenya National Bureau of Statistics (KNBS)"
      reference_year: 2019
      previous_year: 2009
      national_population: 47564296
      source_name: "2019 Kenya Population and Housing Census (KPHC)"
    dhs:
      survey_id: "KE2022DHS"
      survey_year: 2022
      name: "Kenya Demographic and Health Survey 2022"
    levels:
      1:
        name: "County"
        name_plural: "Counties"
        type: "polygon"
        feature_count: 47
        available: true
        file: "data/processed/KEN/level1.geojson"
        id_field: "id"
        name_field: "name"
        parent_id_field: null
      2:
        name: "Sub-County"
        name_plural: "Sub-Counties"
        type: "polygon"
        feature_count: 290
        available: true
        file: "data/processed/KEN/level2.geojson"
        id_field: "id"
        name_field: "name"
        parent_id_field: "parent_id"
      3:
        name: "Ward"
        name_plural: "Wards"
        type: "polygon"
        feature_count: 1452
        available: true
        file: "data/processed/KEN/level3.geojson"
        id_field: "id"
        name_field: "name"
        parent_id_field: "parent_id"
      4:
        name: "Sub-location / Village"
        name_plural: "Sub-locations / Villages"
        type: "point"
        feature_count: 5000
        available: true
        is_point: true
        file: "data/processed/KEN/level4_points.geojson"
        id_field: "id"
        name_field: "name"
        parent_id_field: "parent_id"
        notes: "Village-level features are point settlement locations from OpenStreetMap/KNBS; polygons are not published at village level."

