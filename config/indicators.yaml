# Indicator definitions for East Africa Demographic Map
# Covers: Population & Structure, Growth & Migration, Health & Wellbeing, Education & Economy

categories:
  - id: "population_structure"
    label: "Population & Structure"
  - id: "growth_migration"
    label: "Growth & Migration"
  - id: "health_wellbeing"
    label: "Health & Wellbeing"
  - id: "education_economy"
    label: "Education & Economy"

indicators:
  # 1. Population & Structure
  total_population:
    id: "total_population"
    label: "Total Population"
    category: "population_structure"
    unit: "people"
    format: "integer"
    color_palette: "Blues"
    description: "Total resident population count according to official national census and projections."
    comparable_east_africa: true
    reference_note: "Reference years: Kenya 2019, Tanzania 2022, Uganda 2024, Rwanda 2022, Burundi 2022."

  population_density:
    id: "population_density"
    label: "Population Density"
    category: "population_structure"
    unit: "people/km²"
    format: "float_1"
    color_palette: "YlOrRd"
    description: "Number of people per square kilometer of land area, calculated using equal-area geometry."
    comparable_east_africa: true
    reference_note: "Derived from boundary equal-area projection (EPSG:102022 / Africa Albers Equal Area Conic)."

  sex_ratio:
    id: "sex_ratio"
    label: "Sex Ratio (Males per 100 Females)"
    category: "population_structure"
    unit: "males per 100 females"
    format: "float_1"
    color_palette: "Purples"
    description: "Ratio of male population to female population multiplied by 100. Values above 100 indicate more males than females."
    comparable_east_africa: true
    reference_note: "Standard demographic indicator across all 5 censuses."

  pct_under_15:
    id: "pct_under_15"
    label: "% Children Under 15"
    category: "population_structure"
    unit: "%"
    format: "percent_1"
    color_palette: "Teals"
    description: "Percentage of the population aged 0 to 14 years, reflecting youth dependency."
    comparable_east_africa: true
    reference_note: "Derived from 5-year census age cohort aggregation (0-4, 5-9, 10-14)."

  pct_65_plus:
    id: "pct_65_plus"
    label: "% Elderly (Age 65+)"
    category: "population_structure"
    unit: "%"
    format: "percent_1"
    color_palette: "YlOrBr"
    description: "Percentage of the population aged 65 years and older, reflecting old-age dependency."
    comparable_east_africa: true
    reference_note: "Derived from census age cohorts 65+."

  avg_household_size:
    id: "avg_household_size"
    label: "Average Household Size"
    category: "population_structure"
    unit: "persons/household"
    format: "float_1"
    color_palette: "Greens"
    description: "Average number of usual residents per private household."
    comparable_east_africa: true
    reference_note: "Kenya: 3.9 (2019), Tanzania: 4.3 (2022), Rwanda: 4.0 (2022), Uganda: 4.5, Burundi: 4.8."

  number_of_households:
    id: "number_of_households"
    label: "Number of Households"
    category: "population_structure"
    unit: "households"
    format: "integer"
    color_palette: "Blues"
    description: "Total count of enumerated private households."
    comparable_east_africa: false
    reference_note: "Available for Kenya, Tanzania, Rwanda."

  # 2. Growth & Migration
  intercensal_growth_rate:
    id: "intercensal_growth_rate"
    label: "Intercensal Growth Rate (%/yr)"
    category: "growth_migration"
    unit: "%/year"
    format: "percent_1"
    color_palette: "Viridis"
    description: "Average annual exponential or geometric population growth rate between the last two census rounds."
    comparable_east_africa: true
    reference_note: "Intercensal windows: Kenya 2009-2019 (2.2%), Tanzania 2012-2022 (3.2%), Uganda 2014-2024 (2.9%), Rwanda 2012-2022 (2.3%), Burundi 2008-2022 (2.8%)."

  urban_share:
    id: "urban_share"
    label: "Urban Population Share (%)"
    category: "growth_migration"
    unit: "%"
    format: "percent_1"
    color_palette: "PuRd"
    description: "Percentage of the population residing in gazetted urban centers, municipalities, or cities."
    comparable_east_africa: false
    reference_note: "National urban definitions vary between countries."

  # 3. Health & Wellbeing (DHS Program & Census)
  total_fertility_rate:
    id: "total_fertility_rate"
    label: "Total Fertility Rate (TFR)"
    category: "health_wellbeing"
    unit: "children/woman"
    format: "float_1"
    color_palette: "OrRd"
    description: "Average number of children that would be born to a woman over her lifetime if she experienced current age-specific fertility rates."
    comparable_east_africa: true
    reference_note: "Source: DHS Program (KDHS 2022, TDHS 2022, UDHS 2016/22, RDHS 2020, BDHS 2016-17)."

  under_5_mortality:
    id: "under_5_mortality"
    label: "Under-5 Mortality Rate"
    category: "health_wellbeing"
    unit: "deaths / 1,000 live births"
    format: "float_1"
    color_palette: "Reds"
    description: "Probability of dying before reaching age 5 per 1,000 live births."
    comparable_east_africa: true
    reference_note: "Source: DHS Program subnational indicators."

  stunting_rate:
    id: "stunting_rate"
    label: "Child Stunting Rate (% < -2 SD)"
    category: "health_wellbeing"
    unit: "%"
    format: "percent_1"
    color_palette: "YlOrRd"
    description: "Percentage of children under age 5 whose height-for-age is more than 2 standard deviations below the WHO Child Growth Standards median."
    comparable_east_africa: true
    reference_note: "Source: DHS Program nutrition surveys."

  facility_births_pct:
    id: "facility_births_pct"
    label: "Facility-Based Deliveries (%)"
    category: "health_wellbeing"
    unit: "%"
    format: "percent_1"
    color_palette: "YlGn"
    description: "Percentage of live births occurring in a designated health facility."
    comparable_east_africa: true
    reference_note: "Source: DHS maternal health modules."

  contraceptive_prevalence:
    id: "contraceptive_prevalence"
    label: "Modern Contraceptive Prevalence (%)"
    category: "health_wellbeing"
    unit: "%"
    format: "percent_1"
    color_palette: "PuBu"
    description: "Percentage of currently married women aged 15-49 using any modern contraceptive method."
    comparable_east_africa: true
    reference_note: "Source: DHS family planning indicators."

  # 4. Education & Economy
  literacy_rate:
    id: "literacy_rate"
    label: "Adult Literacy Rate (%)"
    category: "education_economy"
    unit: "%"
    format: "percent_1"
    color_palette: "Blues"
    description: "Percentage of population able to read and write with understanding in a national or official language."
    comparable_east_africa: true
    reference_note: "DHS / Census reports: KDHS 2022, TDHS 2022, UBOS 2024 (74%), RDHS 2020, BDHS 2016."

  electricity_access:
    id: "electricity_access"
    label: "Electricity Access (% households)"
    category: "education_economy"
    unit: "%"
    format: "percent_1"
    color_palette: "YlOrBr"
    description: "Percentage of households connected to grid or mini-grid electricity."
    comparable_east_africa: true
    reference_note: "Source: DHS household characteristics & national censuses."

  improved_water:
    id: "improved_water"
    label: "Improved Water Source (% access)"
    category: "education_economy"
    unit: "%"
    format: "percent_1"
    color_palette: "YlGnBu"
    description: "Percentage of population with access to improved drinking water (piped, borehole, protected well/spring, rainwater)."
    comparable_east_africa: true
    reference_note: "Source: DHS Program."

  improved_sanitation:
    id: "improved_sanitation"
    label: "Improved Sanitation (% access)"
    category: "education_economy"
    unit: "%"
    format: "percent_1"
    color_palette: "Greens"
    description: "Percentage of population using improved toilet/latrine facilities not shared with other households."
    comparable_east_africa: true
    reference_note: "Source: DHS Program."

